# ncspot config — colors regenerated by matugen on wallpaper change

use_nerdfont = true
bitrate = 320
gapless = true
notify = true
library_tabs = ["playlists", "tracks", "albums", "artists", "podcasts"]
initial_screen = "library"

[track_format]
left = "%artists - %title"
center = ""
right = "%album  %duration"

[notification_format]
title = "%title"
body = "%artists — %album"

[theme]
background = "{{colors.surface.default.hex}}"
primary = "{{colors.on_surface.default.hex}}"
secondary = "{{colors.outline.default.hex}}"
title = "{{colors.primary.default.hex}}"
playing = "{{colors.primary.default.hex}}"
playing_selected = "{{colors.primary_fixed.default.hex}}"
playing_bg = "{{colors.surface_container.default.hex}}"
highlight = "{{colors.on_surface.default.hex}}"
highlight_bg = "{{colors.surface_container_high.default.hex}}"
error = "{{colors.on_error.default.hex}}"
error_bg = "{{colors.error.default.hex}}"
statusbar = "{{colors.surface.default.hex}}"
statusbar_progress = "{{colors.primary.default.hex}}"
statusbar_bg = "{{colors.primary.default.hex}}"
cmdline = "{{colors.on_surface.default.hex}}"
cmdline_bg = "{{colors.surface_container.default.hex}}"
search_match = "{{colors.tertiary.default.hex}}"

[keybindings]
"Shift+q" = "quit"

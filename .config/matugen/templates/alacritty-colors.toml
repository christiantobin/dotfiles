# Matugen-generated alacritty colors
# Do not edit — regenerated on wallpaper change

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
dim_foreground = "{{colors.outline.default.hex}}"
bright_foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.surface.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.vi_mode_cursor]
text = "{{colors.surface.default.hex}}"
cursor = "{{colors.tertiary.default.hex}}"

[colors.search.matches]
foreground = "{{colors.surface.default.hex}}"
background = "{{colors.outline.default.hex}}"

[colors.search.focused_match]
foreground = "{{colors.surface.default.hex}}"
background = "{{colors.primary.default.hex}}"

[colors.footer_bar]
foreground = "{{colors.surface.default.hex}}"
background = "{{colors.outline.default.hex}}"

[colors.selection]
text = "{{colors.surface.default.hex}}"
background = "{{colors.primary_container.default.hex}}"

[colors.normal]
black = "{{colors.surface_variant.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.primary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.tertiary.default.hex}}"
magenta = "{{colors.tertiary_fixed_dim.default.hex}}"
cyan = "{{colors.primary_fixed_dim.default.hex}}"
white = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black = "{{colors.outline.default.hex}}"
red = "{{colors.error.default.hex}}"
green = "{{colors.primary.default.hex}}"
yellow = "{{colors.secondary.default.hex}}"
blue = "{{colors.tertiary.default.hex}}"
magenta = "{{colors.tertiary_fixed.default.hex}}"
cyan = "{{colors.primary_fixed.default.hex}}"
white = "{{colors.on_surface.default.hex}}"

env = GTK_THEME,Adwaita:dark
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Use ONLY the Intel iGPU for compositing; never open the AMD dGPU (avoids it as a
# render/output device). Pin by STABLE PCI path, not card number: with the dGPU now
# kept awake for suspend, /dev/dri/cardN numbering shifts (Intel became card0, AMD
# card1), so a hardcoded card1 pointed Hyprland at the dGPU and crashed it on boot.
env = AQ_DRM_DEVICES,/dev/dri/intel


exec-once = swww-daemon && sleep 0.5 && swww img "$(readlink -f ~/.config/hypr/current_wallpaper 2>/dev/null || echo ~/Pictures/wallpapers/wallhaven-9d13wx.jpg)" --transition-type any --transition-fps 60
exec-once = hyprlock
exec-once = hypridle
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = nm-applet
exec-once = waybar
exec-once = mako
exec-once = clipse -listen
exec-once = env -u CLAUDECODE alacritty --class claude-code -e /home/christian/.local/bin/claude
exec = ~/.local/bin/battery_chargin.sh 
exec = ~/.local/bin/battery_low.sh
exec = ~/.local/bin/battery_high.sh && ~/.local/bin/wifi_alert.sh

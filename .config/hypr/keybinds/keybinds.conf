####################
### KEYBINDINGS  ###
### (dwm-style) ###
####################

$mainMod = SUPER
$terminal = alacritty
$menu = wofi --show drun

# Launch (dismiss scratchpad first so new windows don't land on special workspace)
bind = $mainMod SHIFT, Return, exec, hyprctl dispatch hidespecialworkspace claude && $terminal
bind = $mainMod, P, exec, hyprctl dispatch hidespecialworkspace claude && $menu
bind = $mainMod SHIFT, T, exec, theme-switch
bind = $mainMod, A, exec, ~/.local/bin/claude-scratchpad

# Window management
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev
bind = $mainMod SHIFT, J, layoutmsg, swapnext
bind = $mainMod SHIFT, K, layoutmsg, swapprev
bind = $mainMod, Return, layoutmsg, swapwithmaster master
binde = $mainMod, H, layoutmsg, mfact -0.05
binde = $mainMod, L, layoutmsg, mfact +0.05

# Layouts
bind = $mainMod, T, layoutmsg, orientationleft    # tiled (master-stack)
bind = $mainMod, slash, layoutmsg, orientationcycle left top  # toggle landscape/portrait tiling
bind = $mainMod, F, fullscreen, 1                  # monocle (maximize)

# Toggle workspace float mode (dwm-style: float ↔ tiled, auto-detects portrait)
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/toggle-float-mode.sh

# Toggle bar
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar

# Lock screen
bind = $mainMod SHIFT, L, exec, hyprlock

# Lid switch — lock before suspend, restore display on open
bindl = , switch:on:Lid Switch, exec, pidof hyprlock || hyprlock
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Reboot
bind = $mainMod CTRL SHIFT, R, exec, sudo reboot

# Quit hyprland
bind = $mainMod SHIFT, Q, exit,

# View all workspaces
bind = $mainMod, 0, workspace, previous

# Switch workspaces (6 like dwm tags)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Focus monitor
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1

# Move window to monitor
bind = $mainMod SHIFT, comma, movewindow, mon:-1
bind = $mainMod SHIFT, period, movewindow, mon:+1

# Tab through recent workspace
bind = $mainMod, Tab, workspace, previous

# Mouse bindings (Alt+LMB move, Alt+RMB resize — like dwm)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Wallpaper picker (matugen)
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wppicker.sh

# Notification center (swaync)
bind = $mainMod, N, exec, swaync-client -t -sw

# Color picker
bind = $mainMod, C, exec, hyprpicker -a

# Waybar style switcher
bind = $mainMod CTRL, B, exec, ~/.config/hypr/scripts/WaybarStyles.sh

# Power menu (wlogout)
bind = $mainMod SHIFT, E, exec, wlogout -b 6

# Screenshot (region to clipboard)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Volume (media keys)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media controls
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

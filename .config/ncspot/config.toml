# ncspot config — colors regenerated by matugen on wallpaper change

use_nerdfont = true
bitrate = 320
gapless = true
notify = true
library_tabs = ["playlists", "tracks", "albums", "artists", "podcasts"]
initial_screen = "library"

[track_format]
left = "%artists - %title"
center = ""
right = "%album  %duration"

[notification_format]
title = "%title"
body = "%artists — %album"

[theme]
background = "#0f1416"
primary = "#ffffff"
secondary = "#abb3b7"
title = "#a4e6ff"
playing = "#a4e6ff"
playing_selected = "#b6eaff"
playing_bg = "#23292b"
highlight = "#ffffff"
highlight_bg = "#2e3336"
error = "#540003"
error_bg = "#ffd2cc"
statusbar = "#0f1416"
statusbar_progress = "#a4e6ff"
statusbar_bg = "#a4e6ff"
cmdline = "#ffffff"
cmdline_bg = "#23292b"
search_match = "#d9d9ff"

[keybindings]
"Shift+q" = "quit"

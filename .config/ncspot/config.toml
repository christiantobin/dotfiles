# ncspot config — colors regenerated by matugen on wallpaper change

use_nerdfont = true
bitrate = 320
gapless = true
notify = true
library_tabs = ["playlists", "tracks", "albums", "artists", "podcasts"]
initial_screen = "library"

[track_format]
left = "%artists - %title"
center = ""
right = "%album  %duration"

[notification_format]
title = "%title"
body = "%artists — %album"

[theme]
background = "#1a110f"
primary = "#ffffff"
secondary = "#c2ada8"
title = "#ffd3c6"
playing = "#ffd3c6"
playing_selected = "#ffdbd1"
playing_bg = "#302623"
highlight = "#ffffff"
highlight_bg = "#3b302d"
error = "#540003"
error_bg = "#ffd2cc"
statusbar = "#1a110f"
statusbar_progress = "#ffd3c6"
statusbar_bg = "#ffd3c6"
cmdline = "#ffffff"
cmdline_bg = "#302623"
search_match = "#efdba1"

[keybindings]
"Shift+q" = "quit"

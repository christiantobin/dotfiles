# ncspot config — colors regenerated by matugen on wallpaper change

use_nerdfont = true
bitrate = 320
gapless = true
notify = true
library_tabs = ["playlists", "tracks", "albums", "artists", "podcasts"]
initial_screen = "library"

[track_format]
left = "%artists - %title"
center = ""
right = "%album  %duration"

[notification_format]
title = "%title"
body = "%artists — %album"

[theme]
background = "#17130b"
primary = "#ffffff"
secondary = "#bcb0a0"
title = "#ffd791"
playing = "#ffd791"
playing_selected = "#ffdea8"
playing_bg = "#2c271f"
highlight = "#ffffff"
highlight_bg = "#383229"
error = "#540003"
error_bg = "#ffd2cc"
statusbar = "#17130b"
statusbar_progress = "#ffd791"
statusbar_bg = "#ffd791"
cmdline = "#ffffff"
cmdline_bg = "#2c271f"
search_match = "#c9e4bb"

[keybindings]
"Shift+q" = "quit"

# Blacklist snd_hda_intel: on this machine it serves ONLY the AMD dGPU's
# HDMI audio function (03:00.1) — internal audio is the Apple T2 card
# (AppleT2x6), not HDA. With amdgpu blacklisted, vga_switcheroo never
# activates, so the kernel disables runtime PM for this device and it
# pins the dGPU PCIe power domain in D0 (package power/thermal drain →
# iGPU clamp stutter). HDMI audio is unusable anyway without amdgpu.
#
# If amdgpu is ever re-enabled for external monitors, remove this file
# to get HDMI audio back.
blacklist snd_hda_intel
